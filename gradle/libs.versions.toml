# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version = "1.1.0" }

# Fragment
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version = "1.8.5" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose-multiplatform" }

# Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
