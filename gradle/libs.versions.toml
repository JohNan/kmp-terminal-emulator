    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose"
]
koin = [
    "koin-android",
    "koin-androidx-compose"
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]
ssh = [
    "sshj",
    "bouncycastle-bcprov",
    "bouncycastle-bcpkix",
    "conscrypt-android"
]
sshd-test = [
    "sshd-core",
    "sshd-scp",
    "sshd-sftp"
]
unit-test = [
    "junit",
    "mockk",
    "kotlinx-coroutines-test",
    "turbine",
    "robolectric",
    "androidx-test-core",
    "androidx-test-runner",
    "androidx-test-ext-junit",
    "koin-test",
    "koin-test-junit4"
]

