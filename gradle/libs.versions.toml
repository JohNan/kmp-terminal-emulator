# Compose
compose-bom = "2025.12.01"

# Navigation
navigation-compose = "2.9.6"
navigation-compose-multiplatform = "2.9.2"

# Dependency Injection
koin = "4.1.1"

# Coroutines
coroutines = "1.10.2"

# Date Time
datetime = "0.8.0"

# Serialization
kotlinx-serialization = "1.8.0"

# Compose Multiplatform
compose-multiplatform = "1.11.1"

# Room
room = "2.8.4"
