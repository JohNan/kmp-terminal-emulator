name: Publish Production Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            VERSION_NAME="0.1.0"
          else
            VERSION_NAME=${LATEST_TAG#v}
            VERSION_NAME=${VERSION_NAME%%-*}
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Calculated Production Version: $VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Maven Packages to Local Staging & GitHub Packages
        run: ./gradlew publish -Pversion=${{ env.version_name }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Bundle and Publish to Maven Central (Sonatype Central Portal)
        if: env.SONATYPE_USERNAME != '' && env.SONATYPE_PASSWORD != ''
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          if [ -d "build/staging-repo" ]; then
            echo "Packaging artifacts into bundle.zip..."
            cd build/staging-repo
            zip -r ../bundle.zip .
            cd ../..
            
            echo "Uploading bundle to Sonatype Central Portal API..."
            AUTH=$(echo -n "${{ secrets.SONATYPE_USERNAME }}:${{ secrets.SONATYPE_PASSWORD }}" | base64 -w 0)
            RESPONSE=$(curl --request POST \
              --url "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
              --header "Authorization: Bearer ${AUTH}" \
              --form "bundle=@build/bundle.zip" \
              --write-out "%{http_code}" \
              --silent \
              --output response.txt)
            
            echo "Sonatype Portal HTTP Status: $RESPONSE"
            cat response.txt
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "Bundle successfully submitted to Maven Central!"
            else
              echo "Sonatype Central Portal upload failed with status $RESPONSE"
              exit 1
            fi
          else
            echo "Warning: build/staging-repo directory not found, skipping Maven Central upload."
          fi

      - name: Build WebAssembly Distribution
        run: ./gradlew :demo-web:wasmJsBrowserDistribution --no-daemon

      - name: Bundle Release Artifacts
        run: |
          mkdir -p release-bundle
          cp -r demo-web/build/dist/wasmJs/productionExecutable/* release-bundle/
          if [ -f demo-html/index.html ]; then
            cp demo-html/index.html release-bundle/demo.html
          fi
          cd release-bundle
          zip -r ../kmp-terminal-wasm.zip *

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@JohNan'

      - name: Prepare and Publish NPM Package
        run: |
          mkdir -p npm-package
          cp -r demo-web/build/dist/wasmJs/productionExecutable/* npm-package/
          
          cat <<EOF > npm-package/package.json
          {
            "name": "@JohNan/kmp-terminal",
            "version": "${{ env.version_name }}",
            "description": "Kotlin Multiplatform Terminal Emulator compiled to WebAssembly",
            "main": "demo-web.js",
            "files": [
              "demo-web.js",
              "*.wasm",
              "composeResources/**/*"
            ],
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            },
            "repository": {
              "type": "git",
              "url": "git@github.com:JohNan/kmp-terminal-emulator.git"
            }
          }
          EOF

          cd npm-package
          npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Linux and Windows Libraries
        run: ./gradlew :terminal-core:linkReleaseStaticLinuxX64 :terminal-core:linkReleaseSharedLinuxX64 :terminal-core:linkReleaseStaticLinuxArm64 :terminal-core:linkReleaseSharedLinuxArm64 :terminal-core:linkReleaseStaticMingwX64 :terminal-core:linkReleaseSharedMingwX64 --no-daemon

      - name: Prepare Native Linux and Windows Release Assets
        run: |
          mkdir -p native-assets
          cp terminal-core/build/bin/linuxX64/releaseStatic/libterminal_core.a native-assets/libterminal_core-linuxX64.a
          cp terminal-core/build/bin/linuxX64/releaseShared/libterminal_core.so native-assets/libterminal_core-linuxX64.so
          cp terminal-core/build/bin/linuxArm64/releaseStatic/libterminal_core.a native-assets/libterminal_core-linuxArm64.a
          cp terminal-core/build/bin/linuxArm64/releaseShared/libterminal_core.so native-assets/libterminal_core-linuxArm64.so
          cp terminal-core/build/bin/mingwX64/releaseStatic/libterminal_core.a native-assets/libterminal_core-mingwX64.a
          if [ -f terminal-core/build/bin/mingwX64/releaseShared/terminal_core.dll ]; then
            cp terminal-core/build/bin/mingwX64/releaseShared/terminal_core.dll native-assets/libterminal_core-mingwX64.dll
          fi

      - name: Update GitHub Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.version_name }}
          name: v${{ env.version_name }}
          files: |
            kmp-terminal-wasm.zip
            native-assets/libterminal_core-linuxX64.a
            native-assets/libterminal_core-linuxX64.so
            native-assets/libterminal_core-linuxArm64.a
            native-assets/libterminal_core-linuxArm64.so
            native-assets/libterminal_core-mingwX64.a
            native-assets/libterminal_core-mingwX64.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-native-macos:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ needs.build-and-release.outputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              VERSION_NAME="0.1.0"
            else
              VERSION_NAME=${LATEST_TAG#v}
              VERSION_NAME=${VERSION_NAME%%-*}
            fi
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "Calculated Production Version: $VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Native macOS Targets
        run: ./gradlew :terminal-core:linkReleaseStaticMacosArm64 :terminal-core:linkReleaseStaticMacosX64 :terminal-core:linkReleaseSharedMacosArm64 :terminal-core:linkReleaseSharedMacosX64 --no-daemon

      - name: Prepare Native macOS Release Assets
        run: |
          mkdir -p macos-assets
          cp terminal-core/build/bin/macosArm64/releaseStatic/libterminal_core.a macos-assets/libterminal_core-macosArm64.a
          cp terminal-core/build/bin/macosX64/releaseStatic/libterminal_core.a macos-assets/libterminal_core-macosX64.a
          cp terminal-core/build/bin/macosArm64/releaseShared/libterminal_core.dylib macos-assets/libterminal_core-macosArm64.dylib
          cp terminal-core/build/bin/macosX64/releaseShared/libterminal_core.dylib macos-assets/libterminal_core-macosX64.dylib

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.version_name }}
          files: |
            macos-assets/libterminal_core-macosArm64.a
            macos-assets/libterminal_core-macosX64.a
            macos-assets/libterminal_core-macosArm64.dylib
            macos-assets/libterminal_core-macosX64.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
