name: Publish Production Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            VERSION_NAME="0.1.0"
          else
            VERSION_NAME=${LATEST_TAG#v}
            VERSION_NAME=${VERSION_NAME%%-*}
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "Calculated Production Version: $VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish Maven Packages to GitHub Packages
        run: ./gradlew publish -Pversion=${{ env.version_name }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebAssembly Distribution
        run: ./gradlew :demo-web:wasmJsBrowserDistribution --no-daemon

      - name: Bundle Release Artifacts
        run: |
          mkdir -p release-bundle
          cp demo-web/build/dist/wasmJs/productionExecutable/demo-web.js release-bundle/
          cp demo-web/build/dist/wasmJs/productionExecutable/demo-web.wasm release-bundle/
          cp demo-html/index.html release-bundle/
          cd release-bundle
          zip -r ../kmp-terminal-wasm.zip *

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@JohNan'

      - name: Prepare and Publish NPM Package
        run: |
          mkdir -p npm-package
          cp -r demo-web/build/dist/wasmJs/productionExecutable/* npm-package/
          
          cat <<EOF > npm-package/package.json
          {
            "name": "@JohNan/kmp-terminal",
            "version": "${{ env.version_name }}",
            "description": "Kotlin Multiplatform Terminal Emulator compiled to WebAssembly",
            "main": "demo-web.js",
            "files": [
              "demo-web.js",
              "*.wasm",
              "composeResources/**/*"
            ],
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            },
            "repository": {
              "type": "git",
              "url": "git@github.com:JohNan/kmp-terminal-emulator.git"
            }
          }
          EOF

          cd npm-package
          npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version_name }}
          name: v${{ env.version_name }}
          files: kmp-terminal-wasm.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
