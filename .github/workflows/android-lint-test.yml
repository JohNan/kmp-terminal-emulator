name: Android Lint & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run KtLint Check
        run: ./gradlew :agy-android-ui:ktlintCheck --no-daemon

      - name: Run Android Unit Tests
        run: ./gradlew :agy-android-ui:testDebugUnitTest --no-daemon
