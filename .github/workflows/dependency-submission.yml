name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - '**.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-gradle:
    name: submit-gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
        env:
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: automatic_dependency_submission_gradle-submit-gradle
        with:
          dependency-graph: generate-and-submit
          dependency-graph-exclude-configurations: '^ktlint.*$'
