name: KMP Terminal Pre-Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Pre-release Track (alpha, beta, rc, snapshot)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc
          - snapshot

permissions:
  contents: write
  packages: write

jobs:
  deploy-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version Code and Name
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "Latest Tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No existing releases or tags found. Defaulting to initial version 0.1.0."
            BASE_VERSION="0.1.0"
          elif [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Detected Production tag. Bumping patch."
            VERSION_NO_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NO_V"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-1}
            PATCH=${PATCH:-0}
            NEW_PATCH=$((PATCH + 1))
            BASE_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          else
            echo "Detected Pre-release tag. Keeping base version."
            VERSION_NO_V=${LATEST_TAG#v}
            BASE_VERSION=${VERSION_NO_V%%-*}
          fi

          echo "Base Version: $BASE_VERSION"

          # Determine Iteration for the specific track
          TRACK="${{ inputs.track }}"
          PREFIX="v$BASE_VERSION-$TRACK."

          EXISTING_TAGS=$(git tag -l "$PREFIX*")
          MAX_ITERATION=-1

          for TAG in $EXISTING_TAGS; do
            ITERATION=${TAG#$PREFIX}
            if [[ "$ITERATION" =~ ^[0-9]+$ ]]; then
              if (( ITERATION > MAX_ITERATION )); then
                MAX_ITERATION=$ITERATION
              fi
            fi
          done

          NEXT_ITERATION=$((MAX_ITERATION + 1))
          FULL_VERSION_NAME="$BASE_VERSION-$TRACK.$NEXT_ITERATION"
          VERSION_NAME="$FULL_VERSION_NAME"

          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "full_version_name=$FULL_VERSION_NAME" >> $GITHUB_ENV

          echo "Calculated Version Name: $VERSION_NAME"
          echo "Full Version Name: $FULL_VERSION_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish Maven Packages to GitHub Packages
        run: ./gradlew publish -Pversion=${{ env.version_name }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebAssembly Distribution
        run: ./gradlew :demo-web:wasmJsBrowserDistribution --no-daemon

      - name: Bundle WebAssembly Release Artifacts
        run: |
          mkdir -p release-bundle
          cp -r demo-web/build/dist/wasmJs/productionExecutable/* release-bundle/
          if [ -f demo-html/index.html ]; then
            cp demo-html/index.html release-bundle/demo.html
          fi
          cd release-bundle
          zip -r ../kmp-terminal-wasm.zip *

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@JohNan'

      - name: Prepare and Publish NPM Package
        run: |
          mkdir -p npm-package
          cp -r demo-web/build/dist/wasmJs/productionExecutable/* npm-package/
          
          cat <<EOF > npm-package/package.json
          {
            "name": "@JohNan/kmp-terminal",
            "version": "${{ env.version_name }}",
            "description": "Kotlin Multiplatform Terminal Emulator compiled to WebAssembly",
            "main": "demo-web.js",
            "files": [
              "demo-web.js",
              "*.wasm",
              "composeResources/**/*"
            ],
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            },
            "repository": {
              "type": "git",
              "url": "git@github.com:JohNan/kmp-terminal-emulator.git"
            }
          }
          EOF

          cd npm-package
          npm publish --tag ${{ inputs.track }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pre-Release GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.full_version_name }}
          name: v${{ env.full_version_name }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: kmp-terminal-wasm.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
