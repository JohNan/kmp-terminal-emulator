name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Compile WebAssembly (WasmJs) Target
        run: ./gradlew compileKotlinWasmJs --no-daemon
