name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Compile WebAssembly (WasmJs) Target
        run: ./gradlew compileKotlinWasmJs --no-daemon

      - name: Build Android Demo APK
        run: ./gradlew :demo-mobile:assembleDebug --no-daemon

      - name: Compile iOS Demo (Simulator Target)
        run: ./gradlew :demo-mobile:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Compile TUI Native & Multiplatform Metadata
        run: ./gradlew :terminal-core:allMetadataJar :terminal-tui:allMetadataJar :terminal-tui:compileKotlinLinuxX64 --no-daemon
